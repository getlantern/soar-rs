[package]
name = "soar"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A wire-compatible Rust implementation of Soar, a DNS tunnel for networks that censor everything but DNS"
license = "Apache-2.0"
repository = "https://github.com/getlantern/soar-rs"

[dependencies]
chacha20 = "0.9"
ed25519-dalek = "2"
hkdf = "0.12"
poly1305 = "0.8"
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"
subtle = "2"
x25519-dalek = { version = "2", features = ["static_secrets"] }

[dev-dependencies]
hex = "0.4"
serde_json = "1"
