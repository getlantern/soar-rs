[package]
name = "soar"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A wire-compatible Rust implementation of Soar, a DNS tunnel for networks that censor everything but DNS"
license = "Apache-2.0"
repository = "https://github.com/getlantern/soar-rs"

[dependencies]
base64 = "0.22"
chacha20 = "0.9"
ed25519-dalek = "2"
hkdf = "0.12"
if-addrs = "0.13"
poly1305 = "0.8"
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"
socket2 = "0.6"
subtle = "2"
tokio = { version = "1", features = ["net", "time", "sync", "macros", "io-util", "rt-multi-thread", "signal"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }

[dev-dependencies]
futures = "0.3"
hex = "0.4"
serde_json = "1"
